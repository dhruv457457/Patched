[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 300
fail_on_revert = false

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc = "${ARC_RPC_URL}"

[fmt]
line_length = 110

[lint]
lint_on_build = false
